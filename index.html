<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margin Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered notebook sheet on graph paper; board is the hero, controls and tally sit around it like margin notes. */
:root {
  --paper: #f5f6f1;
  --grid: #dfe6ee;
  --graphite: #2c3138;
  --muted: #6d7580;
  --ink-x: #2547a8;
  --ink-o: #c2412d;
  --sheet: #fbfcf8;
  --rule: #c9d2dc;
  --focus: #e0a500;
  --ok: #2f8a4c;
  --wait: #c58a00;
  --hi: #fdf0b4;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a24; --grid: #1f2836; --graphite: #e4e8ee; --muted: #8e98a6;
    --ink-x: #7ea2ff; --ink-o: #ff8a73; --sheet: #19212d; --rule: #2e3a4b; --focus: #f2c14e;
    --ok: #5fd08a; --wait: #f2c14e; --hi: #2f2e22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a24; --grid: #1f2836; --graphite: #e4e8ee; --muted: #8e98a6;
  --ink-x: #7ea2ff; --ink-o: #ff8a73; --sheet: #19212d; --rule: #2e3a4b; --focus: #f2c14e;
  --ok: #5fd08a; --wait: #f2c14e; --hi: #2f2e22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--graphite);
  font-family: var(--font-mono);
  font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(32px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
}
.sheet {
  max-width: 540px;
  margin: 0 auto;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 28px clamp(16px, 5vw, 36px) 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  box-shadow: 0 1px 0 var(--rule), 0 12px 30px -18px rgba(20, 30, 50, .35);
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.7rem, 6vw, 2.2rem);
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 0;
  text-wrap: balance;
}
h1 .x { color: var(--ink-x); }
h1 .o { color: var(--ink-o); }
.round { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 999px; padding: 3px; gap: 2px; }
.seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  font-size: .78rem; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted);
  transition: background .15s, color .15s;
}
.seg input:checked + label { background: var(--graphite); color: var(--sheet); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
fieldset.seg { margin: 0; min-width: 0; position: relative; }
fieldset.seg:disabled { opacity: .4; }
fieldset.seg:disabled label { cursor: default; }
.seg.rules input:checked + label { background: var(--hi); color: var(--graphite); box-shadow: inset 0 0 0 1.5px var(--graphite); }

.rules-note { margin: 0; font-size: .8rem; line-height: 1.55; color: var(--muted); max-width: 62ch; }
.rules-note b { color: var(--graphite); font-weight: 600; }

/* Online room panel: reads like a note clipped to the sheet */
.online {
  border: 1.5px dashed var(--rule);
  border-radius: 6px;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.online-row { display: flex; align-items: center; gap: 10px; font-size: .82rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot[data-state="waiting"] { background: var(--wait); animation: pulse 1.4s ease-in-out infinite; }
.dot[data-state="connected"] { background: var(--ok); }
.dot[data-state="error"] { background: var(--ink-o); }
@keyframes pulse { 50% { opacity: .3; } }
.share { display: flex; gap: 8px; flex-wrap: wrap; }
.share input {
  flex: 1 1 180px; min-width: 0;
  font: .78rem var(--font-mono); color: var(--graphite);
  background: transparent; border: 1px solid var(--rule); border-radius: 999px; padding: 8px 12px;
}
.share input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.status {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.15rem;
  min-height: 1.5em;
  display: flex; align-items: center; gap: 10px;
}
.status .chip {
  font-family: var(--font-mono); font-weight: 600; font-size: .8rem;
  width: 1.9em; height: 1.9em; display: inline-grid; place-items: center; flex: none;
  border-radius: 50%; border: 1.5px solid currentColor;
}
.status.x .chip { color: var(--ink-x); }
.status.o .chip { color: var(--ink-o); }
.status.draw .chip { color: var(--muted); }

.board-wrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; margin: 0 auto; }
.board {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
}
.cell {
  appearance: none; border: 0; background: transparent; padding: 14%; margin: 0;
  cursor: pointer; border-radius: 6px; position: relative; min-width: 0; min-height: 0;
  -webkit-tap-highlight-color: transparent;
}
.cell[aria-disabled="true"] { cursor: default; }
.cell:not([aria-disabled="true"]):hover::after {
  content: attr(data-ghost); position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 500; font-size: clamp(2.2rem, 12vw, 3.6rem);
  color: var(--muted); opacity: .25;
}
.cell:focus-visible { outline: 2px dashed var(--focus); outline-offset: -6px; }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; transition: opacity .25s; }
.cell path, .cell circle { fill: none; stroke-width: 9; stroke-linecap: round; }
.cell.x path { stroke: var(--ink-x); }
.cell.o circle { stroke: var(--ink-o); }
.draw-in { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .32s ease-out forwards; }
.draw-in.second { animation-delay: .16s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.cell.dim { opacity: .3; transition: opacity .3s; }

/* Vanishing: the mark about to be rubbed out goes pale */
.cell.fading svg { opacity: .28; }

/* Ultimate: nine small boards; the one you must play in is highlighted like a marker swipe */
.board.ultimate .sub {
  position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  margin: 7%; border-radius: 3px; transition: background .2s, opacity .3s; min-width: 0; min-height: 0;
}
.board.ultimate .sub.active { background: var(--hi); box-shadow: 0 0 0 4px var(--hi); }
.board.ultimate .cell { padding: 13%; border-radius: 0; }
.board.ultimate .cell:nth-of-type(-n+6) { border-bottom: 1.4px solid var(--rule); }
.board.ultimate .cell:not(:nth-of-type(3n)) { border-right: 1.4px solid var(--rule); }
.board.ultimate .cell path, .board.ultimate .cell circle { stroke-width: 12; }
.board.ultimate .cell:not([aria-disabled="true"]):hover::after { font-size: clamp(.85rem, 4.5vw, 1.35rem); }
.board.ultimate .cell:focus-visible { outline-offset: -2px; }
.claim { position: absolute; inset: 6%; pointer-events: none; }
.claim svg { width: 100%; height: 100%; display: block; overflow: visible; }
.claim path, .claim circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.sub.won-x .claim path { stroke: var(--ink-x); }
.sub.won-o .claim circle { stroke: var(--ink-o); }
.sub.won-x .cell, .sub.won-o .cell { opacity: .2; }
.sub.drawn .cell { opacity: .35; }
.sub.dim { opacity: .3; }

.overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.overlay .gridline { stroke: var(--graphite); stroke-width: 2.4; fill: none; stroke-linecap: round; }
.overlay .winline { stroke: var(--graphite); stroke-width: 5; fill: none; stroke-linecap: round; opacity: .85; }

.tally { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); padding-top: 16px; margin: 0; }
.tally div { display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.tally dt { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; max-width: 100%; padding-inline: 4px; }
.tally dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.tally .tx dd { color: var(--ink-x); }
.tally .to dd { color: var(--ink-o); }
.tally .marks { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); min-height: 1.2em; letter-spacing: .05em; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  font: 600 .85rem var(--font-mono); padding: 10px 18px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--graphite); background: var(--graphite); color: var(--sheet);
}
.btn.small { padding: 7px 14px; font-size: .78rem; }
.btn.ghost { background: transparent; color: var(--graphite); }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .4; cursor: default; filter: none; }
.confirm { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: .82rem; }
.hint { text-align: center; font-size: .72rem; color: var(--muted); margin: 0; }
.game-area { display: flex; flex-direction: column; gap: 22px; }
.player-line { text-align: center; font-size: .78rem; color: var(--muted); margin: 0; }
.player-line b { color: var(--graphite); font-weight: 600; overflow-wrap: anywhere; }
.linkish {
  font: inherit; color: var(--graphite); background: none; border: 0; padding: 0 2px;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.linkish:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

/* Name card: a sign-in line on the notebook page */
.intro { display: flex; flex-direction: column; gap: 14px; padding-block: 8px 4px; }
.intro-lead {
  font-family: var(--font-display); font-weight: 500; font-size: 1.25rem; line-height: 1.3;
  margin: 0; text-wrap: balance;
}
.field-label { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.name-input {
  font: 500 1.6rem var(--font-display); color: var(--ink-x);
  background: transparent; border: 0; border-bottom: 2px solid var(--graphite);
  padding: 4px 2px 6px; width: 100%; min-width: 0; border-radius: 0;
}
.name-input::placeholder { color: var(--muted); opacity: .5; }
.name-input:focus-visible { outline: none; border-bottom-color: var(--focus); }
.form-error { color: var(--ink-o); font-size: .8rem; margin: 0; }
.intro .btn { align-self: flex-start; }
.p2 { display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.p2 input {
  font: 600 .85rem var(--font-mono); color: var(--ink-o); background: transparent;
  border: 0; border-bottom: 1.5px solid var(--rule); padding: 4px 2px; width: 9em; min-width: 0;
}
.p2 input:focus-visible { outline: none; border-bottom-color: var(--focus); }

@media (prefers-reduced-motion: reduce) {
  .draw-in { animation: none; stroke-dashoffset: 0; }
  .seg label, .cell.dim, .cell svg, .board.ultimate .sub { transition: none; }
  .dot[data-state="waiting"] { animation: none; }
}
</style>

<main class="sheet">
  <header>
    <h1><span class="x">Tic</span>·Tac·<span class="o">Toe</span></h1>
    <span class="round" id="round">Round 1</span>
  </header>

  <form class="intro" id="nameForm" novalidate>
    <p class="intro-lead" id="introLead">Before you play, what should we call you?</p>
    <label class="field-label" for="playerName">Your name</label>
    <input class="name-input" id="playerName" maxlength="20" autocomplete="nickname" placeholder="Type your name" spellcheck="false">
    <p class="form-error" id="nameError" hidden>Type a name to start playing.</p>
    <button class="btn" id="startBtn" type="submit">Start playing</button>
  </form>

  <div class="game-area" id="gameArea" hidden>
  <div class="controls">
    <fieldset class="seg rules" id="rulesSeg">
      <legend>Rules</legend>
      <input type="radio" name="rules" id="rules-classic" value="classic" checked><label for="rules-classic">Classic</label>
      <input type="radio" name="rules" id="rules-vanish" value="vanish"><label for="rules-vanish">Vanishing</label>
      <input type="radio" name="rules" id="rules-ultimate" value="ultimate"><label for="rules-ultimate">Ultimate</label>
    </fieldset>
    <fieldset class="seg" id="modeSeg">
      <legend>Opponent</legend>
      <input type="radio" name="mode" id="mode-ai" value="ai" checked><label for="mode-ai">vs Computer</label>
      <input type="radio" name="mode" id="mode-pvp" value="pvp"><label for="mode-pvp">Same device</label>
      <input type="radio" name="mode" id="mode-online" value="online"><label for="mode-online">Online</label>
    </fieldset>
    <fieldset class="seg" id="diffSeg">
      <legend>Difficulty</legend>
      <input type="radio" name="diff" id="diff-easy" value="easy"><label for="diff-easy">Easy</label>
      <input type="radio" name="diff" id="diff-hard" value="hard" checked><label for="diff-hard">Hard</label>
    </fieldset>
    <label class="p2" id="p2Wrap" hidden>O is <input id="p2Name" maxlength="20" placeholder="Player O" spellcheck="false"></label>
  </div>

  <p class="rules-note" id="rulesNote" hidden></p>

  <section class="online" id="online" hidden aria-label="Online room">
    <div class="online-row"><span class="dot" id="onlineDot"></span><span id="onlineText"></span></div>
    <div class="share" id="share" hidden>
      <input id="shareLink" readonly aria-label="Invite link">
      <button class="btn small" id="copyLink" type="button">Copy link</button>
    </div>
    <div class="share" id="retryRow" hidden>
      <button class="btn small" id="retryOnline" type="button">Try again</button>
    </div>
  </section>

  <div class="status x" id="status" role="status" aria-live="polite"></div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Tic-tac-toe board"></div>
    <svg class="overlay" viewBox="0 0 300 300" aria-hidden="true">
      <path class="gridline" d="M101 8 C 99 90, 102 200, 100 292"/>
      <path class="gridline" d="M199 6 C 201 110, 198 210, 200 294"/>
      <path class="gridline" d="M8 100 C 90 102, 210 98, 292 101"/>
      <path class="gridline" d="M6 199 C 110 201, 200 197, 294 200"/>
      <path class="winline" id="winline" d="" />
    </svg>
  </div>

  <dl class="tally">
    <div class="tx"><dt id="labelX">You · X</dt><dd id="scoreX">0</dd><span class="marks" id="marksX"></span></div>
    <div class="td"><dt>Draws</dt><dd id="scoreD">0</dd><span class="marks" id="marksD"></span></div>
    <div class="to"><dt id="labelO">Computer · O</dt><dd id="scoreO">0</dd><span class="marks" id="marksO"></span></div>
  </dl>

  <div class="actions" id="actions">
    <button class="btn" id="newRound" type="button">New round</button>
    <button class="btn ghost" id="resetScores" type="button">Reset scores</button>
  </div>
  <div class="confirm" id="confirm" hidden>
    <span>Clear the tally?</span>
    <button class="btn" id="confirmYes" type="button">Clear</button>
    <button class="btn ghost" id="confirmNo" type="button">Keep</button>
  </div>

  <p class="player-line">Playing as <b id="meName"></b> · <button class="linkish" id="changeName" type="button">Change name</button></p>
  <p class="hint">Arrow keys move between squares · Enter or Space plays</p>
  </div>
</main>

<script>
(() => {
  const WIN_LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];
  const BOARD_NAMES = ['top-left', 'top', 'top-right', 'left', 'centre', 'right', 'bottom-left', 'bottom', 'bottom-right'];
  const RULE_NAMES = { classic: 'Classic', vanish: 'Vanishing', ultimate: 'Ultimate' };
  const VANISH_KEEP = 3;

  // ---------- pure logic ----------
  function getWinner(b) {
    for (const line of WIN_LINES) {
      const [a, c, d] = line;
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line };
    }
    return null;
  }
  const emptyCells = b => b.reduce((acc, v, i) => (v ? acc : (acc.push(i), acc)), []);
  const other = p => (p === 'X' ? 'O' : 'X');
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // One engine for all three rule sets. States are plain data so they can be sent online.
  //   classic  – 9 cells
  //   vanish   – 9 cells; each player keeps their last 3 marks, a 4th erases the oldest
  //   ultimate – 81 cells (board b, square s at b*9+s); your square picks the opponent's next board
  function newEngine(rules) {
    return {
      rules,
      board: Array(rules === 'ultimate' ? 81 : 9).fill(null),
      queue: { X: [], O: [] },
      small: Array(9).fill(null),
      next: -1,
      current: 'X',
      winner: null, line: null, draw: false,
      lastMove: -1, vanished: -1
    };
  }
  function openBoards(g) {
    if (g.next >= 0 && !g.small[g.next]) return [g.next];
    const r = [];
    for (let b = 0; b < 9; b++) if (!g.small[b]) r.push(b);
    return r;
  }
  function legalMoves(g) {
    if (g.winner || g.draw) return [];
    if (g.rules !== 'ultimate') return emptyCells(g.board);
    const out = [];
    for (const b of openBoards(g)) for (let s = 0; s < 9; s++) if (!g.board[b * 9 + s]) out.push(b * 9 + s);
    return out;
  }
  function step(g, i) {
    const p = g.current, board = g.board.slice();
    const n = {
      rules: g.rules, board, queue: g.queue, small: g.small, next: g.next, current: other(p),
      winner: null, line: null, draw: false, lastMove: i, vanished: -1
    };
    if (g.rules === 'vanish') {
      const q = { X: g.queue.X.slice(), O: g.queue.O.slice() };
      if (q[p].length >= VANISH_KEEP) { n.vanished = q[p].shift(); board[n.vanished] = null; }
      board[i] = p; q[p].push(i); n.queue = q;
      const w = getWinner(board);
      if (w) { n.winner = p; n.line = w.line; }
    } else if (g.rules === 'ultimate') {
      board[i] = p;
      const b = Math.floor(i / 9), s = i % 9;
      const sub = board.slice(b * 9, b * 9 + 9);
      const w = getWinner(sub);
      if (w || sub.every(Boolean)) { n.small = g.small.slice(); n.small[b] = w ? p : 'D'; }
      n.next = s;
      const big = getWinner(n.small.map(v => (v === 'D' ? null : v)));
      if (big) { n.winner = p; n.line = big.line; }
      else if (n.small.every(Boolean)) n.draw = true;
    } else {
      board[i] = p;
      const w = getWinner(board);
      if (w) { n.winner = p; n.line = w.line; }
      else if (board.every(Boolean)) n.draw = true;
    }
    if (n.winner || n.draw) n.current = p;
    return n;
  }

  // ---------- computer players ----------
  // Classic: full minimax, never loses.
  function minimax(b, turn, me, depth) {
    const w = getWinner(b);
    if (w) return w.player === me ? 10 - depth : depth - 10;
    if (b.every(Boolean)) return 0;
    let best = turn === me ? -Infinity : Infinity;
    for (const i of emptyCells(b)) {
      b[i] = turn;
      const s = minimax(b, other(turn), me, depth + 1);
      b[i] = null;
      best = turn === me ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function classicBest(b, me) {
    let bestScore = -Infinity, moves = [];
    for (const i of emptyCells(b)) {
      b[i] = me;
      const s = minimax(b, other(me), me, 1);
      b[i] = null;
      if (s > bestScore) { bestScore = s; moves = [i]; }
      else if (s === bestScore) moves.push(i);
    }
    return pick(moves);
  }

  // Vanishing: games never fill up, so search a fixed number of moves ahead and score open lines.
  function vanishEval(g, p) {
    const o = other(p), b = g.board;
    // A mark that is about to be erased is worth less.
    const doomed = { X: g.queue.X.length >= VANISH_KEEP ? g.queue.X[0] : -1, O: g.queue.O.length >= VANISH_KEEP ? g.queue.O[0] : -1 };
    let s = 0;
    for (const line of WIN_LINES) {
      let mine = 0, theirs = 0;
      for (const i of line) {
        if (b[i] === p) mine += i === doomed[p] ? 0.5 : 1;
        else if (b[i] === o) theirs += i === doomed[o] ? 0.5 : 1;
      }
      if (!theirs) s += mine >= 2 ? 4 * mine : mine;
      if (!mine) s -= theirs >= 2 ? 4 * theirs : theirs;
    }
    if (b[4] === p) s += 1; else if (b[4] === o) s -= 1;
    return s;
  }
  function vanishSearch(g, depth, alpha, beta, ply) {
    if (g.winner) return -(1000 - ply);
    if (depth === 0) return vanishEval(g, g.current);
    let best = -Infinity;
    for (const m of legalMoves(g)) {
      const v = -vanishSearch(step(g, m), depth - 1, -beta, -alpha, ply + 1);
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  function vanishBest(g, depth = 10) {
    let bestScore = -Infinity, moves = [];
    for (const m of legalMoves(g)) {
      const v = -vanishSearch(step(g, m), depth - 1, -Infinity, Infinity, 1);
      if (v > bestScore) { bestScore = v; moves = [m]; }
      else if (v === bestScore) moves.push(m);
    }
    return pick(moves);
  }

  // Ultimate: too big to search fully, so play thousands of random games from each option
  // and keep the move that wins most often (Monte Carlo tree search).
  function ultimateBest(root, ms = 700) {
    const legal = legalMoves(root);
    for (const m of legal) if (step(root, m).winner) return m;
    const rootNode = { s: root, m: -1, parent: null, kids: [], untried: legal.slice(), n: 0, w: 0, by: other(root.current) };
    const end = performance.now() + ms;
    let iter = 0;
    while ((iter & 63) || performance.now() < end) {
      iter++;
      let node = rootNode;
      while (!node.untried.length && node.kids.length) {
        const ln = Math.log(node.n);
        let best = null, bv = -Infinity;
        for (const k of node.kids) {
          const v = k.w / k.n + 1.25 * Math.sqrt(ln / k.n);
          if (v > bv) { bv = v; best = k; }
        }
        node = best;
      }
      if (node.untried.length) {
        const m = node.untried.splice(Math.floor(Math.random() * node.untried.length), 1)[0];
        const s = step(node.s, m);
        const kid = { s, m, parent: node, kids: [], untried: legalMoves(s), n: 0, w: 0, by: node.s.current };
        node.kids.push(kid);
        node = kid;
      }
      let s = node.s;
      while (!s.winner && !s.draw) s = step(s, pick(legalMoves(s)));
      for (let k = node; k; k = k.parent) {
        k.n++;
        if (s.winner === k.by) k.w += 1; else if (s.draw) k.w += 0.5;
      }
    }
    let best = null;
    for (const k of rootNode.kids) if (!best || k.n > best.n) best = k;
    return best ? best.m : pick(legal);
  }

  // ---------- state ----------
  const AI = 'O';
  const ROOM_PREFIX = 'margin-ttt-';
  const freshGame = (rules = 'classic') => Object.assign(newEngine(rules), {
    scores: { X: 0, O: 0, D: 0 },
    round: 1,
    gameOver: false,
    result: null
  });
  let game = freshGame();
  let mode = 'ai';
  let difficulty = 'hard';
  let aiTimer = null;
  let focusIndex = 4;

  // Online: the host owns the game and is X; the guest sends requests and mirrors the host's state.
  const net = { role: null, room: null, es: null, phase: 'idle', error: '' };
  const myMark = () => (net.role === 'host' ? 'X' : 'O');
  const connected = () => net.phase === 'connected';

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board');
  let cells = [], subs = [], rendered = [], claimShown = [], builtRules = null;

  const SVG_X = '<svg viewBox="0 0 100 100"><path class="draw-in" style="--len:120" d="M18 18 L82 82"/><path class="draw-in second" style="--len:120" d="M82 18 L18 82"/></svg>';
  const SVG_O = '<svg viewBox="0 0 100 100"><circle class="draw-in" style="--len:220" cx="50" cy="50" r="34" transform="rotate(-90 50 50)"/></svg>';
  const SVG_X_STATIC = SVG_X.replace(/ class="draw-in( second)?"/g, '');
  const SVG_O_STATIC = SVG_O.replace(/ class="draw-in"/g, '');

  function makeCell(i) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cell';
    btn.dataset.index = i;
    btn.setAttribute('role', 'gridcell');
    btn.addEventListener('click', () => onCellClick(i));
    cells.push(btn);
    return btn;
  }
  function buildBoard() {
    const ult = game.rules === 'ultimate';
    boardEl.innerHTML = '';
    cells = []; subs = [];
    boardEl.classList.toggle('ultimate', ult);
    if (!ult) {
      for (let i = 0; i < 9; i++) boardEl.appendChild(makeCell(i));
    } else {
      for (let b = 0; b < 9; b++) {
        const sub = document.createElement('div');
        sub.className = 'sub';
        for (let s = 0; s < 9; s++) sub.appendChild(makeCell(b * 9 + s));
        const claim = document.createElement('div');
        claim.className = 'claim';
        sub.appendChild(claim);
        boardEl.appendChild(sub);
        subs.push(sub);
      }
    }
    rendered = Array(cells.length).fill(undefined);
    claimShown = Array(9).fill(null);
    builtRules = game.rules;
    focusIndex = ult ? 40 : 4;
  }
  function resetRendered() {
    rendered.fill(undefined);
    claimShown.fill(null);
  }

  const isAiTurn = () => mode === 'ai' && game.current === AI && !game.gameOver;
  function canPlay() {
    if (game.gameOver) return false;
    if (mode === 'ai') return game.current !== AI;
    if (mode === 'online') return connected() && game.current === myMark();
    return true;
  }

  // ---------- names ----------
  const cleanName = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, 20);
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let myName = '';
  try { myName = cleanName(localStorage.getItem('ttt-name')); } catch (e) {}
  let p2Name = '';
  function nameOf(p) {
    if (mode === 'ai') return p === 'X' ? myName : 'Computer';
    if (mode === 'online') return p === myMark() ? myName : (net.peerName || 'Your friend');
    return p === 'X' ? myName : (p2Name || 'Player O');
  }
  function isMe(p) {
    if (mode === 'ai') return p === 'X';
    if (mode === 'online') return p === myMark();
    return false;
  }

  // ---------- rendering ----------
  const RULE_NOTES = {
    vanish: '<b>Vanishing:</b> each player keeps only 3 marks. Placing a 4th rubs out your oldest one, shown faded. There are no draws.',
    ultimate: '<b>Ultimate:</b> nine small boards. The square you pick sends your opponent to the matching small board (pick the top-right square, they play in the top-right board). Win a small board to claim it; claim three in a row to win. Sent to a finished board? Play in any open one.'
  };

  function render() {
    if (builtRules !== game.rules) buildBoard();
    const { board, result } = game;
    const ult = game.rules === 'ultimate';
    const winLine = result && result.line;
    const playable = canPlay();
    const legal = new Set(playable ? legalMoves(game) : []);
    const fading = game.rules === 'vanish' && !game.gameOver && game.queue[game.current].length >= VANISH_KEEP
      ? game.queue[game.current][0] : -1;

    for (let i = 0; i < cells.length; i++) {
      const c = cells[i], v = board[i];
      if (rendered[i] !== v) {
        c.innerHTML = v ? (i === game.lastMove ? (v === 'X' ? SVG_X : SVG_O) : (v === 'X' ? SVG_X_STATIC : SVG_O_STATIC)) : '';
        rendered[i] = v;
      }
      c.classList.toggle('x', v === 'X');
      c.classList.toggle('o', v === 'O');
      c.classList.toggle('dim', !ult && !!winLine && !winLine.includes(i));
      c.classList.toggle('fading', i === fading);
      c.setAttribute('aria-disabled', String(!legal.has(i)));
      c.dataset.ghost = game.current;
      let where;
      if (ult) {
        const b = Math.floor(i / 9), s = i % 9;
        where = `${BOARD_NAMES[b]} board, row ${Math.floor(s / 3) + 1}, column ${(s % 3) + 1}`;
      } else {
        where = `Row ${Math.floor(i / 3) + 1}, column ${(i % 3) + 1}`;
      }
      c.setAttribute('aria-label', `${where}, ${v ? v : 'empty'}${i === fading ? ', vanishes next' : ''}`);
      c.tabIndex = i === focusIndex ? 0 : -1;
    }

    if (ult) {
      const open = game.gameOver ? [] : openBoards(game);
      const restricted = open.length === 1 && game.small.filter(v => !v).length > 1;
      subs.forEach((sub, b) => {
        const owner = game.small[b];
        sub.classList.toggle('active', restricted && open[0] === b);
        sub.classList.toggle('won-x', owner === 'X');
        sub.classList.toggle('won-o', owner === 'O');
        sub.classList.toggle('drawn', owner === 'D');
        sub.classList.toggle('dim', !!winLine && !winLine.includes(b));
        if (claimShown[b] !== owner) {
          sub.lastElementChild.innerHTML = owner === 'X' ? SVG_X : owner === 'O' ? SVG_O : '';
          claimShown[b] = owner;
        }
      });
    }

    // status line
    const st = $('status');
    st.className = 'status';
    const say = (cls, chip, msg) => { st.classList.add(cls); st.innerHTML = `<span class="chip">${chip}</span> ${msg}`; };
    const me = esc(myName);
    if (result && result.player) {
      const who = esc(nameOf(result.player));
      say(result.player.toLowerCase(), result.player, isMe(result.player) ? `You win this round, ${me}!` : `${who} wins this round.`);
    } else if (result) {
      say('draw', '=', ult ? 'Every board is decided and nobody has three in a row. It’s a draw.' : "Cat's game. Nobody wins.");
    } else if (mode === 'online' && !connected()) {
      say(myMark().toLowerCase(), myMark(), net.role === 'host' ? 'Waiting for your friend to join.' : 'Joining the game…');
    } else {
      const who = esc(nameOf(game.current));
      const local = isMe(game.current) || mode === 'pvp';
      let msg;
      if (isAiTurn()) msg = 'Computer is thinking…';
      else if (isMe(game.current)) msg = `Your move, ${me}.`;
      else if (mode === 'online') msg = `${who} is thinking…`;
      else msg = `${who}’s move.`;
      if (local && ult) {
        const open = openBoards(game);
        msg += open.length === 1 ? ` Play in the ${BOARD_NAMES[open[0]]} board.` : ' Play in any open board.';
      }
      if (local && fading >= 0) msg += ' Your faded mark vanishes next.';
      say(game.current.toLowerCase(), game.current, msg);
    }

    // win line across the board (for Ultimate it runs across the small boards)
    const wl = $('winline');
    if (winLine) {
      const ctr = i => [ (i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50 ];
      const [x1, y1] = ctr(winLine[0]), [x2, y2] = ctr(winLine[2]);
      const ext = 34, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      wl.setAttribute('d', `M${x1 - ux * ext} ${y1 - uy * ext} L${x2 + ux * ext} ${y2 + uy * ext}`);
      wl.style.stroke = result.player === 'X' ? 'var(--ink-x)' : 'var(--ink-o)';
    } else {
      wl.setAttribute('d', '');
    }

    // tally
    const tallyMarks = n => n > 20 ? '' : '||||/ '.repeat(Math.floor(n / 5)) + '|'.repeat(n % 5);
    $('scoreX').textContent = game.scores.X;
    $('scoreO').textContent = game.scores.O;
    $('scoreD').textContent = game.scores.D;
    $('marksX').textContent = tallyMarks(game.scores.X);
    $('marksO').textContent = tallyMarks(game.scores.O);
    $('marksD').textContent = tallyMarks(game.scores.D);
    const label = p => `${nameOf(p)} · ${p}`;
    $('meName').textContent = myName;
    $('p2Wrap').hidden = mode !== 'pvp';
    $('labelX').textContent = label('X');
    $('labelO').textContent = label('O');
    $('round').textContent = `Round ${game.round} · ${RULE_NAMES[game.rules]}`;

    const note = RULE_NOTES[game.rules];
    $('rulesNote').hidden = !note;
    if (note && $('rulesNote').dataset.rules !== game.rules) {
      $('rulesNote').innerHTML = note;
      $('rulesNote').dataset.rules = game.rules;
    }

    $('diffSeg').disabled = mode !== 'ai';
    $('rulesSeg').disabled = mode === 'online' && net.role === 'guest';
    $(`mode-${mode}`).checked = true;
    $(`diff-${difficulty}`).checked = true;
    $(`rules-${game.rules}`).checked = true;
    const offline = mode === 'online' && !connected();
    $('newRound').disabled = offline;
    $('resetScores').disabled = offline;

    renderOnline();
  }

  function renderOnline() {
    $('online').hidden = mode !== 'online';
    if (mode !== 'online') return;
    const dot = $('onlineDot'), text = $('onlineText');
    $('share').hidden = !(net.role === 'host' && net.room && ['waiting', 'connected', 'left'].includes(net.phase));
    $('retryRow').hidden = net.phase !== 'error';
    const rulesBit = net.role === 'guest' ? ' Your friend picks the rules.' : '';
    const states = {
      starting: ['waiting', 'Opening a room…'],
      waiting: ['waiting', 'Send this link to a friend. You play X, they play O.'],
      joining: ['waiting', 'Connecting to your friend’s room…'],
      connected: ['connected', net.role === 'host'
        ? `${net.peerName || 'Your friend'} joined. You play X.`
        : `Playing with ${net.peerName || 'your friend'}. You play O.${rulesBit}`],
      left: ['error', net.role === 'host'
        ? `${net.peerName || 'Your friend'} left. They can rejoin with the same link.`
        : 'Lost touch with your friend. Reconnecting when they come back…'],
      error: ['error', net.error || 'Something went wrong with the connection.']
    };
    const [d, t] = states[net.phase] || ['', ''];
    dot.dataset.state = d;
    text.textContent = t;
    if (net.room) $('shareLink').value = inviteLink(net.room);
  }

  // ---------- game flow ----------
  function play(i) {
    if (game.gameOver || !legalMoves(game).includes(i)) return;
    const n = step(game, i);
    Object.assign(game, n);
    if (n.winner) {
      game.gameOver = true; game.result = { player: n.winner, line: n.line }; game.scores[n.winner]++;
    } else if (n.draw) {
      game.gameOver = true; game.result = { player: null }; game.scores.D++;
    }
    render();
    broadcast();
    if (isAiTurn()) scheduleAi();
  }

  function chooseAiMove() {
    const moves = legalMoves(game);
    if (difficulty === 'easy') return pick(moves);
    if (game.rules === 'vanish') return vanishBest(game);
    if (game.rules === 'ultimate') return ultimateBest(game);
    return classicBest(game.board.slice(), AI);
  }

  function scheduleAi() {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(() => {
      if (!isAiTurn()) return;
      play(chooseAiMove());
    }, game.rules === 'ultimate' && difficulty === 'hard' ? 200 : 420);
  }

  function onCellClick(i) {
    focusIndex = i;
    if (!canPlay() || !legalMoves(game).includes(i)) return;
    if (mode === 'online' && net.role === 'guest') {
      send({ t: 'move', i });
      return;
    }
    play(i);
  }

  function startNextRound() {
    clearTimeout(aiTimer);
    Object.assign(game, newEngine(game.rules));
    game.gameOver = false;
    game.result = null;
    game.round++;
    // Alternate who opens each round.
    game.current = game.round % 2 === 1 ? 'X' : 'O';
    render();
    broadcast();
    if (isAiTurn()) scheduleAi();
  }

  function resetScores() {
    game.scores = { X: 0, O: 0, D: 0 };
    game.round = 0;
    startNextRound();
  }

  function changeRules(rules) {
    clearTimeout(aiTimer);
    game = freshGame(rules);
    render();
    broadcast();
    if (isAiTurn()) scheduleAi();
  }

  function requestNewRound() {
    if (mode === 'online' && net.role === 'guest') return send({ t: 'new' });
    startNextRound();
  }
  function requestReset() {
    if (mode === 'online' && net.role === 'guest') return send({ t: 'reset' });
    resetScores();
  }

  // ---------- online play (relayed through ntfy.sh over plain HTTPS) ----------
  // Direct browser-to-browser links fail on many work, school and mobile networks, so every
  // message goes through a public relay instead. Each room is an unguessable topic; the host
  // owns the game, the guest only sends requests.
  const RELAY = 'https://ntfy.sh/';
  const TICK_MS = 5000, HEARTBEAT_MS = 15000, TIMEOUT_MS = 40000, JOIN_TRIES = 6;

  function inviteLink(room) {
    return `${location.origin}${location.pathname}?room=${room}`;
  }
  function makeRoomCode(len = 10) {
    const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
    let s = '';
    for (const n of crypto.getRandomValues(new Uint32Array(len))) s += abc[n % abc.length];
    return s;
  }
  const myId = (() => {
    try {
      let v = sessionStorage.getItem('ttt-player');
      if (!v) { v = makeRoomCode(8); sessionStorage.setItem('ttt-player', v); }
      return v;
    } catch (e) { return makeRoomCode(8); }
  })();

  function send(msg, tries = 3) {
    if (!net.room) return;
    const room = net.room;
    const body = JSON.stringify(Object.assign({}, msg, { from: myId }));
    fetch(RELAY + ROOM_PREFIX + room, { method: 'POST', body, keepalive: msg.t === 'bye' })
      .then(r => { if (!r.ok) throw new Error(r.status); })
      .catch(() => {
        if (tries > 1 && net.room === room && msg.t !== 'ping' && msg.t !== 'bye') {
          setTimeout(() => send(msg, tries - 1), 1200);
        }
      });
    net.lastSent = Date.now();
  }
  function broadcast() {
    if (mode === 'online' && net.role === 'host' && net.guest) {
      send({ t: 'state', game, seq: ++net.seq, to: net.guest, names: { host: myName, guest: net.peerName } });
    }
  }
  function setPhase(phase, error) {
    net.phase = phase;
    net.error = error || '';
    if (phase === 'connected') net.lastSeen = Date.now();
    render();
  }

  function peerLeft() {
    if (net.phase !== 'connected') return;
    if (net.role === 'host') net.guest = null;
    setPhase('left');
  }

  function subscribe(onReady) {
    const es = new EventSource(RELAY + ROOM_PREFIX + net.room + '/sse');
    net.es = es;
    let ready = false;
    es.onopen = () => { if (!ready) { ready = true; onReady(); } };
    es.onmessage = e => {
      let msg;
      try { msg = JSON.parse(JSON.parse(e.data).message); } catch (err) { return; }
      if (!msg || typeof msg !== 'object' || msg.from === myId) return;
      if (msg.to && msg.to !== myId) return;
      if (net.role === 'host') onHostMessage(msg); else onGuestMessage(msg);
    };
    es.onerror = () => {
      if (es.readyState !== EventSource.CLOSED || net.es !== es) return;
      if (!ready) {
        setPhase('error', 'Could not reach the game relay (ntfy.sh). Check your internet connection, or whether an ad blocker or network filter blocks ntfy.sh, then try again.');
        return;
      }
      // The browser gave up reconnecting on its own; start a fresh subscription.
      setTimeout(() => { if (net.es === es) subscribe(() => { if (net.role === 'guest') send({ t: 'hello', name: myName }); }); }, 3000);
    };
  }

  function onHostMessage(msg) {
    if (msg.t === 'hello') {
      const free = !net.guest || net.guest === msg.from || Date.now() - net.lastSeen > TIMEOUT_MS;
      if (!free) { send({ t: 'full', to: msg.from }); return; }
      net.guest = msg.from;
      net.peerName = cleanName(msg.name);
      setPhase('connected');
      broadcast();
      return;
    }
    if (msg.from !== net.guest) return;
    net.lastSeen = Date.now();
    if (msg.t === 'bye') peerLeft();
    else if (msg.t === 'move' && Number.isInteger(msg.i) && game.current === 'O' && legalMoves(game).includes(msg.i)) play(msg.i);
    else if (msg.t === 'new') startNextRound();
    else if (msg.t === 'reset') resetScores();
    else if (msg.t === 'name') { net.peerName = cleanName(msg.name); render(); broadcast(); }
  }

  function onGuestMessage(msg) {
    if (msg.t === 'full') {
      if (net.phase !== 'connected') setPhase('error', 'This game already has two players. Ask your friend for a new link.');
      return;
    }
    if (net.host && msg.from !== net.host) return;
    if (msg.t === 'state' && msg.game && RULE_NAMES[msg.game.rules]) {
      if (net.host === msg.from && msg.seq <= net.seq) { net.lastSeen = Date.now(); return; }
      net.host = msg.from;
      net.seq = msg.seq;
      net.lastSeen = Date.now();
      if (msg.names) net.peerName = cleanName(msg.names.host);
      game = msg.game;
      if (net.phase !== 'connected') setPhase('connected'); else render();
    } else if (msg.t === 'bye') {
      peerLeft();
    }
  }

  // One timer drives heartbeats, join retries and noticing a friend who went quiet.
  setInterval(() => {
    if (mode !== 'online' || !net.room) return;
    const now = Date.now();
    if (net.role === 'guest' && net.phase === 'joining' && net.subscribed) {
      if (net.helloCount >= JOIN_TRIES) {
        setPhase('error', 'Could not find that game. Your friend may have closed it. Ask them to keep the game open, then try again.');
      } else { net.helloCount++; send({ t: 'hello', name: myName }); }
      return;
    }
    if (net.role === 'guest' && net.phase === 'left') { send({ t: 'hello', name: myName }); return; }
    if (!connected()) return;
    if (now - net.lastSent > HEARTBEAT_MS) {
      if (net.role === 'host') broadcast(); else send({ t: 'ping' });
    }
    if (now - net.lastSeen > TIMEOUT_MS) peerLeft();
  }, TICK_MS);
  window.addEventListener('pagehide', () => { if (mode === 'online' && net.room) send({ t: 'bye' }); });

  function resetNet() {
    Object.assign(net, {
      role: null, room: null, es: null, phase: 'idle', error: '',
      guest: null, host: null, seq: 0, lastSeen: 0, lastSent: 0, helloCount: 0, subscribed: false, peerName: ''
    });
  }

  function teardownOnline(keepUrl) {
    try { net.es && net.es.close(); } catch (e) {}
    resetNet();
    if (!keepUrl && new URLSearchParams(location.search).has('room')) {
      history.replaceState(null, '', location.pathname);
    }
  }

  function hostRoom() {
    resetNet();
    net.role = 'host';
    net.room = makeRoomCode();
    setPhase('starting');
    subscribe(() => { net.subscribed = true; if (net.phase === 'starting') setPhase('waiting'); });
  }

  function joinRoom(room) {
    resetNet();
    net.role = 'guest';
    net.room = room;
    setPhase('joining');
    subscribe(() => { net.subscribed = true; net.helloCount = 1; send({ t: 'hello', name: myName }); });
  }

  function retryOnline() {
    const { role, room } = net;
    teardownOnline(true);
    if (role === 'guest' && room) joinRoom(room); else hostRoom();
  }

  function switchMode(next) {
    clearTimeout(aiTimer);
    if (mode === 'online') teardownOnline();
    mode = next;
    game = freshGame(game.rules);
    resetRendered();
    if (mode === 'online') hostRoom();
    render();
    if (isAiTurn()) scheduleAi();
  }

  // ---------- controls ----------
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', e => switchMode(e.target.value)));
  document.querySelectorAll('input[name="rules"]').forEach(r => r.addEventListener('change', e => changeRules(e.target.value)));
  document.querySelectorAll('input[name="diff"]').forEach(r => r.addEventListener('change', e => {
    clearTimeout(aiTimer);
    difficulty = e.target.value; game = freshGame(game.rules); resetRendered(); render();
  }));
  $('newRound').addEventListener('click', requestNewRound);
  $('resetScores').addEventListener('click', () => { $('actions').hidden = true; $('confirm').hidden = false; $('confirmNo').focus(); });
  $('confirmNo').addEventListener('click', () => { $('confirm').hidden = true; $('actions').hidden = false; $('resetScores').focus(); });
  $('confirmYes').addEventListener('click', () => {
    $('confirm').hidden = true; $('actions').hidden = false;
    requestReset(); $('newRound').focus();
  });
  $('copyLink').addEventListener('click', async () => {
    const input = $('shareLink'), btn = $('copyLink');
    try { await navigator.clipboard.writeText(input.value); btn.textContent = 'Copied'; }
    catch (e) { input.focus(); input.select(); btn.textContent = 'Press Ctrl+C'; }
    setTimeout(() => { btn.textContent = 'Copy link'; }, 1800);
  });
  $('shareLink').addEventListener('focus', e => e.target.select());
  $('retryOnline').addEventListener('click', retryOnline);

  // Arrow keys move over the visible grid: 3×3 normally, 9×9 in Ultimate.
  const toRC = i => {
    if (game.rules !== 'ultimate') return [Math.floor(i / 3), i % 3];
    const b = Math.floor(i / 9), s = i % 9;
    return [Math.floor(b / 3) * 3 + Math.floor(s / 3), (b % 3) * 3 + (s % 3)];
  };
  const fromRC = (r, c) => {
    if (game.rules !== 'ultimate') return r * 3 + c;
    return (Math.floor(r / 3) * 3 + Math.floor(c / 3)) * 9 + (r % 3) * 3 + (c % 3);
  };
  boardEl.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const size = game.rules === 'ultimate' ? 9 : 3;
    let [r, c] = toRC(focusIndex);
    if (e.key === 'ArrowLeft') c = (c + size - 1) % size;
    if (e.key === 'ArrowRight') c = (c + 1) % size;
    if (e.key === 'ArrowUp') r = (r + size - 1) % size;
    if (e.key === 'ArrowDown') r = (r + 1) % size;
    focusIndex = fromRC(r, c);
    cells.forEach((cell, i) => cell.tabIndex = i === focusIndex ? 0 : -1);
    cells[focusIndex].focus();
  });
  boardEl.addEventListener('focusin', e => {
    const i = Number(e.target.dataset.index);
    if (!Number.isNaN(i)) focusIndex = i;
  });

  // ---------- name form and boot ----------
  const roomParam = (new URLSearchParams(location.search).get('room') || '').toLowerCase();
  let pendingRoom = /^[a-z0-9]{4,12}$/.test(roomParam) ? roomParam : null;

  function showNameForm() {
    $('introLead').textContent = pendingRoom
      ? 'You’ve been invited to a game. What’s your name?'
      : (myName ? 'Welcome back. Still you?' : 'Before you play, what should we call you?');
    $('startBtn').textContent = $('gameArea').hidden ? 'Start playing' : 'Save name';
    $('playerName').value = myName;
    $('nameError').hidden = true;
    $('nameForm').hidden = false;
    $('gameArea').hidden = true;
    $('playerName').focus();
  }

  $('nameForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = cleanName($('playerName').value);
    if (!name) { $('nameError').hidden = false; $('playerName').focus(); return; }
    const changed = name !== myName;
    myName = name;
    try { localStorage.setItem('ttt-name', name); } catch (err) {}
    $('nameForm').hidden = true;
    $('gameArea').hidden = false;
    if (pendingRoom) {
      mode = 'online';
      joinRoom(pendingRoom);
      pendingRoom = null;
    } else if (changed && mode === 'online' && net.room) {
      if (net.role === 'host') broadcast(); else send({ t: 'name', name: myName });
    }
    render();
    if (isAiTurn()) scheduleAi();
    cells[focusIndex].focus();
  });
  $('changeName').addEventListener('click', showNameForm);
  $('p2Name').addEventListener('input', e => { p2Name = cleanName(e.target.value); render(); });

  render();
  showNameForm();
})();
</script>
